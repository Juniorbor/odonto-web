services:
  - type: web
    name: odonto-web
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
        # Postgres do Neon (já em uso pela produção, não expira). Preencha a
        # connection string no passo de revisão do Blueprint:
        # postgresql://user:pass@ep-xxx-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: OdontoCloud
      - key: NEXT_PUBLIC_APP_URL
        sync: false
        value: https://odonto-web.onrender.com
      - key: STORAGE_DIR
        value: /var/data/storage