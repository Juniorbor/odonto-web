databases:
  - name: odonto-postgres
    plan: free
services:
  - type: web
    name: odonto-web
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: odonto-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: OdontoCloud
      - key: NEXT_PUBLIC_APP_URL
        sync: false
        value: https://seudominio.com.br
      - key: STORAGE_DIR
        value: /var/data/storage