services:
  - type: web
    name: eliz-decora-festas
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: Eliz Decora Festas
      - key: NEXT_PUBLIC_APP_URL
        sync: false
        value: https://eliz-decora-festas.onrender.com
      - key: STORAGE_DIR
        value: /var/data/storage